x-superset-image: &superset-image apache/superset:latest
x-superset-volumes: &superset-volumes
  - ./pythonpath_dev:/app/pythonpath
  - superset_home:/app/superset_home

services:
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data

  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  superset:
    image: *superset-image
    restart: unless-stopped
    env_file:
      - .env
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes

  superset-init:
    image: *superset-image
    env_file:
      - .env
    command: ["/app/docker/docker-init.sh"]
    user: "root"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes: *superset-volumes
    healthcheck:
      disable: true

  superset-worker:
    image: *superset-image
    restart: unless-stopped
    env_file:
      - .env
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    user: "root"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]

  superset-worker-beat:
    image: *superset-image
    restart: unless-stopped
    env_file:
      - .env
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    user: "root"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    healthcheck:
      disable: true

  # ===========================================
  # Trino - Data Caching & Transformation Layer
  # ===========================================
  trino:
    image: trinodb/trino:467
    restart: unless-stopped
    ports:
      - "${TRINO_PORT:-8085}:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino_data:/data
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  hive-metastore:
    image: apache/hive:4.0.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "127.0.0.1:9083:9083"
    depends_on:
      metastore-db:
        condition: service_healthy
    volumes:
      - trino_data:/user/hive/warehouse
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  metastore-db:
    image: postgres:16
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minio minio123;
      mc mb --ignore-existing myminio/trino-cache;
      mc mb --ignore-existing myminio/trino-warehouse;
      exit 0;
      "

  trino-scheduler:
    image: trinodb/trino:467
    restart: unless-stopped
    depends_on:
      trino:
        condition: service_healthy
    volumes:
      - ./trino/jobs:/jobs:ro
    entrypoint: >
      /bin/sh -c "
      echo '*/15 * * * * /usr/lib/trino/bin/trino --server trino:8080 --file /jobs/refresh_cache.sql >> /var/log/refresh.log 2>&1' > /etc/crontabs/root &&
      crond -f -l 2
      "

volumes:
  superset_home:
  db_home:
  redis:
  trino_data:
  metastore_db:
  minio_data:
